# Applied over the installed Humble nav2_bringup defaults by bringup.launch.py.
bt_navigator:
  ros__parameters:
    robot_base_frame: base_footprint
    transform_tolerance: 0.3
controller_server:
  ros__parameters:
    controller_frequency: 10.0
    min_y_velocity_threshold: 0.001
    failure_tolerance: 0.0
    progress_checker:
      required_movement_radius: 0.15
      movement_time_allowance: 15.0
    general_goal_checker:
      xy_goal_tolerance: 0.2
      yaw_goal_tolerance: 0.2
    FollowPath:
      max_vel_x: 0.2
      max_vel_y: 0.0
      max_vel_theta: 0.3
      max_speed_xy: 0.2
      acc_lim_x: 0.2
      acc_lim_theta: 0.3
      decel_lim_x: -0.3
      decel_lim_theta: -0.4
      trans_stopped_velocity: 0.02
      transform_tolerance: 0.3
      critics: [RotateToGoal, Oscillation, ObstacleFootprint, GoalAlign, PathAlign, PathDist, GoalDist]
local_costmap:
  local_costmap:
    ros__parameters:
      robot_base_frame: base_footprint
      footprint: '[[0.35,0.4],[0.35,-0.4],[-0.35,-0.4],[-0.35,0.4]]'
      footprint_padding: 0.05
      width: 6
      height: 6
      transform_tolerance: 0.3
      plugins: [voxel_layer, inflation_layer]
      voxel_layer:
        origin_z: 0.0
        z_resolution: 0.15
        z_voxels: 16
        max_obstacle_height: 1.9
        observation_sources: cloud
        cloud:
          topic: /perception/obstacles
          sensor_frame: mid360_imu
          data_type: PointCloud2
          marking: true
          clearing: true
          min_obstacle_height: 0.1
          max_obstacle_height: 1.9
          obstacle_max_range: 5.0
          raytrace_max_range: 6.0
      inflation_layer:
        inflation_radius: 0.65
global_costmap:
  global_costmap:
    ros__parameters:
      robot_base_frame: base_footprint
      footprint: '[[0.35,0.4],[0.35,-0.4],[-0.35,-0.4],[-0.35,0.4]]'
      footprint_padding: 0.05
      plugins: [static_layer, inflation_layer]
      inflation_layer:
        inflation_radius: 0.65
planner_server:
  ros__parameters:
    GridBased:
      allow_unknown: false
behavior_server:
  ros__parameters:
    robot_base_frame: base_footprint
    behavior_plugins: [wait]
velocity_smoother:
  ros__parameters:
    smoothing_frequency: 20.0
    feedback: OPEN_LOOP
    max_velocity: [0.2, 0.0, 0.3]
    min_velocity: [0.0, 0.0, -0.3]
    max_accel: [0.2, 0.0, 0.3]
    max_decel: [-0.3, 0.0, -0.4]
    velocity_timeout: 0.2
