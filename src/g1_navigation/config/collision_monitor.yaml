# Shared by navigation and teleop. Verified against Humble nav2_collision_monitor 1.1.20.
collision_monitor:
  ros__parameters:
    base_frame_id: base_footprint
    odom_frame_id: odom
    cmd_vel_in_topic: cmd_vel
    cmd_vel_out_topic: cmd_vel_safe
    transform_tolerance: 0.3
    # Humble drops a stale source silently (treated as no obstacles); the command
    # bridge's perception health from sensor_adapter is what stops the robot then.
    source_timeout: 0.3
    stop_pub_timeout: 1.0
    base_shift_correction: true
    # No direction-agnostic slowdown zone: it would also slow escape motions.
    polygons: [stop_zone, approach_zone]
    # Backstop: the unpadded Nav2 footprint. Stop trips on (points inside > max_points),
    # so max_points: 0 stops all motion on a single point.
    stop_zone:
      type: polygon
      points: [0.35, 0.4, 0.35, -0.4, -0.35, -0.4, -0.35, 0.4]
      action_type: stop
      max_points: 0
      visualize: true
      polygon_pub_topic: stop_zone
    # Main behaviour: the padded footprint simulated along the command; speed is
    # scaled to keep time_before_collision before contact. Humble 1.1.20 takes an
    # approach polygon's shape ONLY from footprint_topic (static points are ignored):
    # navigation uses the local costmap's padded footprint (footprint +
    # footprint_padding from nav2_overrides.yaml); teleop launch overrides the topic
    # with footprint_publisher's identical rectangle. Until a footprint has been
    # received the polygon is empty and only stop_zone acts; once received, the
    # last footprint is kept.
    # max_points: 1.1.20 freezes on (points inside >= max_points) at t=0, so 1 means a
    # single point inside freezes all motion (turning and reversing too; recover with
    # the Unitree remote). 0 would freeze unconditionally.
    approach_zone:
      type: polygon
      action_type: approach
      footprint_topic: /local_costmap/published_footprint
      time_before_collision: 1.2
      simulation_time_step: 0.1
      max_points: 1
      visualize: true
      polygon_pub_topic: approach_zone
    observation_sources: [cloud]
    cloud:
      type: pointcloud
      topic: /perception/obstacles
      min_height: 0.1
      max_height: 1.9
      enabled: true
